#cloud-config
package_update: false
package_upgrade: false

write_files:
  - path: /usr/local/sbin/ai-workstation-bootstrap
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      # Replace these with immutable/versioned raw URLs before deployment.
      INSTALL_URL="REPLACE_WITH_VERSIONED_RAW_INSTALL_URL"
      VERIFY_URL="REPLACE_WITH_VERSIONED_RAW_VERIFY_URL"

      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT

      curl -fsSL "$INSTALL_URL" -o "$tmp/install.sh"
      curl -fsSL "$VERIFY_URL" -o "$tmp/verify.sh"
      chmod +x "$tmp/install.sh" "$tmp/verify.sh"
      "$tmp/install.sh"

runcmd:
  - [bash, -lc, "/usr/local/sbin/ai-workstation-bootstrap"]
