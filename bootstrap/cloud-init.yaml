#cloud-config
package_update: false
package_upgrade: false

write_files:
  - path: /usr/local/sbin/ai-workstation-bootstrap
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      INSTALL_URL="https://raw.githubusercontent.com/wglst/ai-workstation/9f10640cefc9e3fd9e5942869b825dc617baadb6/install.sh"
      VERIFY_URL="https://raw.githubusercontent.com/wglst/ai-workstation/9f10640cefc9e3fd9e5942869b825dc617baadb6/verify.sh"

      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT

      curl -fsSL "$INSTALL_URL" -o "$tmp/install.sh"
      curl -fsSL "$VERIFY_URL" -o "$tmp/verify.sh"
      chmod +x "$tmp/install.sh" "$tmp/verify.sh"
      "$tmp/install.sh"

runcmd:
  - [bash, -lc, "/usr/local/sbin/ai-workstation-bootstrap"]
